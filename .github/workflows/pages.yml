name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Prepare same-origin release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.4.2
          APK_FILE: Keshu-v0.4.2-preview.apk
          APK_SHA256: 691c4eb451bce72f34c506515febe0e1ed14be0de3ec989239fb8ab28f109639
        run: |
          mkdir -p site/downloads
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_FILE*" \
            --dir site/downloads
          cd site/downloads
          sha256sum --check "$APK_FILE.sha256"
          printf '%s  %s\n' "$APK_SHA256" "$APK_FILE" | sha256sum --check --strict -

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
