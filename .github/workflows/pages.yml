name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Prepare same-origin release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.4.5
          APK_FILE: Keshu-v0.4.5-preview.apk
          APK_SHA256: 87eda782cba64c8e17a4a2177b362ab083aed3874a1ffe222caee4fc9875101d
        run: |
          mkdir -p site/downloads
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$APK_FILE*" \
            --dir site/downloads
          cd site/downloads
          sha256sum --check "$APK_FILE.sha256"
          printf '%s  %s\n' "$APK_SHA256" "$APK_FILE" | sha256sum --check --strict -
          cd ..
          # The app reads this instead of api.github.com, which is unreachable on many mainland
          # networks. Paths stay relative so the manifest survives a change of domain.
          printf '{\n  "version": "%s",\n  "apk": "downloads/%s",\n  "sha256": "%s",\n  "releasePage": "https://github.com/%s/releases/tag/%s"\n}\n' \
            "${RELEASE_TAG#v}" "$APK_FILE" "$APK_SHA256" "$GITHUB_REPOSITORY" "$RELEASE_TAG" \
            > latest.json
          cat latest.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
