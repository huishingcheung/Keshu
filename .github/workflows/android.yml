name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build debug APK
        shell: pwsh
        run: .\gradlew.bat --no-daemon --no-configuration-cache --max-workers=2 assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Keshu-debug-${{ github.sha }}
          path: .build/app/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
